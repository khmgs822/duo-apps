<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Duo Books</title>
<style>
body{font-family:-apple-system,"Hiragino Sans",sans-serif;background:#111418;color:#e6e6e6;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
main{text-align:center;padding:24px}
a{display:inline-block;margin-top:16px;padding:12px 20px;border-radius:24px;background:#3a5a7a;color:#fff;text-decoration:none}
</style>
</head>
<body>
<main>
<p>Duo Books に戻ります…</p>
<a id="back" href="#">Duo Books に戻る</a>
</main>
<script>
// Box のサインインから戻ってきた値（code・state・error）だけを Duo Books に渡す。ほかの値は渡さない
(function () {
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  ['code', 'state', 'error', 'error_description'].forEach(function (k) { if (q.has(k)) out.set(k, q.get(k)); });
  var url = 'com.necotoybox.duoreader://box?' + out.toString();
  document.getElementById('back').href = url;
  location.replace(url);
})();
</script>
</body>
</html>
